[package]
name = "work-planner"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[bin]]
name = "work-planner-cli"
path = "src/main.rs"
