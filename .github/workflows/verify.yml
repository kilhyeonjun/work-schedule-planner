name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --extra dev --frozen
      - run: uvx ruff==0.16.0 check .
      - run: uv run pytest -q
      - run: uv run python scripts/generate_scenarios.py --check
      - run: uv run python scripts/scan_public_boundary.py
